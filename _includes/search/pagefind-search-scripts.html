<!-- Pagefind search — lazy-loaded.
     The Pagefind UI bundle (~30 KB JS + small CSS) is fetched only on first
     interaction with the masthead search button. Paths come from Liquid so
     `baseurl` is respected; URLs are resolved with `new URL(..., origin)` so
     they always hit the same host as the current page (custom domain safe). -->
<script>
(function () {
  var loaded = false;

  var pfJs = {{ "/pagefind/pagefind-ui.js" | relative_url | jsonify }};
  var pfCss = {{ "/pagefind/pagefind-ui.css" | relative_url | jsonify }};

  function absoluteFromSitePath(path) {
    if (/^https?:\/\//.test(path)) return path;
    return new URL(path, window.location.origin).href;
  }

  function loadPagefind() {
    if (loaded) return;
    loaded = true;

    var v = '{{ site.time | date: "%s" }}';

    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = absoluteFromSitePath(pfCss) + '?v=' + v;
    document.head.appendChild(css);

    var js = document.createElement('script');
    js.src = absoluteFromSitePath(pfJs) + '?v=' + v;
    js.onload = function () {
      var container = document.getElementById('pagefind-search');
      if (!container || !window.PagefindUI) return;

      new PagefindUI({
        element: '#pagefind-search',
        showImages: false,
        showSubResults: true,
        resetStyles: false,
        translations: {
          placeholder: '{{ site.data.ui-text[site.locale].search_placeholder_text | default: "Search the site..." }}',
          clear_search: 'Clear search',
          load_more: 'Show more results',
          search_label: 'Search the site',
          zero_results: 'No results found for "[SEARCH_TERM]"',
          one_result: 'One result for "[SEARCH_TERM]"',
          many_results: '[COUNT] results for "[SEARCH_TERM]"',
          searching: 'Searching for "[SEARCH_TERM]"...'
        }
      });

      requestAnimationFrame(function () {
        var input = container.querySelector('input.pagefind-ui__search-input');
        if (input) input.focus();
      });
    };
    js.onerror = function () {
      var container = document.getElementById('pagefind-search');
      if (container) {
        container.innerHTML =
          '<p class="pagefind-search-error">Search bundle could not be loaded (<code>/pagefind/pagefind-ui.js</code>). ' +
          'Production must deploy the full Jekyll output including the Pagefind index: run <code>npx pagefind --site _site</code> after <code>jekyll build</code>, ' +
          'and use <strong>GitHub Actions</strong> as the Pages source (Settings → Pages → Build and deployment → Source: GitHub Actions), not &ldquo;Deploy from a branch.&rdquo; ' +
          'Confirm the latest workflow run uploaded <code>_site</code> with a <code>pagefind/</code> folder.</p>';
      }
    };
    document.head.appendChild(js);
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('.search__toggle');
    if (btn) loadPagefind();
  }, { passive: true });

  if (document.body && document.body.classList.contains('layout--search')) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadPagefind, { once: true });
    } else {
      loadPagefind();
    }
  }
})();
</script>
