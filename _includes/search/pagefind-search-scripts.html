<!-- Pagefind search — lazy-loaded.
     The Pagefind UI bundle (~30 KB JS + small CSS) is fetched only on first
     interaction with the masthead search button, so regular pageviews carry
     zero search-related weight. The index itself (chunks under /pagefind/)
     is requested incrementally by Pagefind as the user types. -->
<script>
(function () {
  var loaded = false;

  function loadPagefind() {
    if (loaded) return;
    loaded = true;

    var v = '{{ site.time | date: "%s" }}';

    var css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = '{{ "/pagefind/pagefind-ui.css" | relative_url }}?v=' + v;
    document.head.appendChild(css);

    var js = document.createElement('script');
    js.src = '{{ "/pagefind/pagefind-ui.js" | relative_url }}?v=' + v;
    js.onload = function () {
      var container = document.getElementById('pagefind-search');
      if (!container || !window.PagefindUI) return;

      new PagefindUI({
        element: '#pagefind-search',
        showImages: false,
        showSubResults: true,
        resetStyles: false,
        translations: {
          placeholder: '{{ site.data.ui-text[site.locale].search_placeholder_text | default: "Search the site..." }}',
          clear_search: 'Clear search',
          load_more: 'Show more results',
          search_label: 'Search the site',
          zero_results: 'No results found for "[SEARCH_TERM]"',
          one_result: 'One result for "[SEARCH_TERM]"',
          many_results: '[COUNT] results for "[SEARCH_TERM]"',
          searching: 'Searching for "[SEARCH_TERM]"...'
        }
      });

      // Auto-focus the input so the first interaction continues smoothly.
      requestAnimationFrame(function () {
        var input = container.querySelector('input.pagefind-ui__search-input');
        if (input) input.focus();
      });
    };
    js.onerror = function () {
      var container = document.getElementById('pagefind-search');
      if (container) {
        container.innerHTML =
          '<p class="pagefind-search-error">Search index not found. ' +
          'Run <code>npx pagefind --site _site</code> after building the site.</p>';
      }
    };
    document.head.appendChild(js);
  }

  document.addEventListener('click', function (e) {
    var btn = e.target.closest && e.target.closest('.search__toggle');
    if (btn) loadPagefind();
  }, { passive: true });

  // Pages that opt in via `layout: search` get Pagefind eagerly.
  if (document.body && document.body.classList.contains('layout--search')) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadPagefind, { once: true });
    } else {
      loadPagefind();
    }
  }
})();
</script>
