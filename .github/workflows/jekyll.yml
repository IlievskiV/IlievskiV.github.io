# Build Jekyll + Pagefind, then (on main) deploy the full _site/ to GitHub Pages.
# Repository → Settings → Pages: set Source to "GitHub Actions" (not a branch build),
# or the live site will be built by GitHub’s Jekyll and will not include /pagefind/.

name: Jekyll build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      # GitHub Actions: JS-based actions move from Node 20 → 24 (see 2025–2026
      # changelog). Ensures checkout/setup-node and similar run on Node 24.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build site
        run: bundle exec jekyll build --trace
      - name: Build Pagefind search index
        run: npx --yes pagefind@^1.1.1 --site _site
      - name: Upload site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
