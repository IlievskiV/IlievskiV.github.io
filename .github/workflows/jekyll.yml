# Build Jekyll + Pagefind, then (on main) deploy the full _site/ to GitHub Pages.
# Repository → Settings → Pages: set Source to "GitHub Actions" (not a branch build),
# or the live site will be built by GitHub’s Jekyll and will not include /pagefind/.

name: Jekyll build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

# Opt in all jobs (including deploy-pages) to the Actions Node 24 runtime early.
# See https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Build site
        run: bundle exec jekyll build --trace
      - name: Build Pagefind search index
        run: npx --yes pagefind@^1.1.1 --site _site
      - name: Verify Pagefind assets exist (must ship with Pages artifact)
        run: |
          set -e
          test -f _site/pagefind/pagefind-ui.js || { echo "missing pagefind-ui.js"; exit 1; }
          test -f _site/pagefind/pagefind-ui.css || { echo "missing pagefind-ui.css"; exit 1; }
          ls -la _site/pagefind | head -30
      - name: Upload site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
